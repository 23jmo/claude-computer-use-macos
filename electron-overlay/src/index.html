<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Claude Overlay</title>
    <style>
      /* Base styles for transparent window */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: transparent;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        /* Allow pointer events to pass through */
        pointer-events: none;
      }

      #root {
        width: 100%;
        height: 100%;
        /* Enable pointer events for interactive elements */
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/index.jsx"
    ></script>
  </body>
</html>
